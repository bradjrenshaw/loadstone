[package]
name = "loadstone-bridge"
description = "cxx bridge exposing loadstone-core to the C++ wxWidgets GUI"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["staticlib"]

[dependencies]
